server:
  port: 8088
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/document?useSSL=false&serverTimezone=UTC%2B7
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
      dialect: org.hibernate.dialect.MySQL8Dialect
      format_sql: true
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB

